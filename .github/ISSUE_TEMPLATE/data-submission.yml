name: 기출 데이터 제보
description: PR을 올리기 어려울 때 문항 메타데이터를 제보합니다. 문항 원문은 적지 마세요.
title: "[데이터] "
body:
  - type: markdown
    attributes:
      value: |
        문항 **메타데이터**만 적어 주세요. 문제 지문·보기·정답·해설은 적지 않습니다.
        작성 규칙은 [CONTRIBUTING.md](https://github.com/DevMinGeonPark/Information-Processing-GISA/blob/main/CONTRIBUTING.md)를 참고하세요.
  - type: input
    id: round
    attributes:
      label: 회차
      description: "연도와 회 (예: 2024년 1회)"
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: 트랙
      options:
        - 필기 (written)
        - 실기 (practical)
    validations:
      required: true
  - type: input
    id: number
    attributes:
      label: 문항 번호
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: 과목
      description: "과목 이름 또는 slug (예: practical-database)"
    validations:
      required: true
  - type: input
    id: concepts
    attributes:
      label: 개념 태그
      description: "data/taxonomy.json의 개념 slug, 여러 개면 쉼표로 구분 (예: p-sql-join, p-sql-select)"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 유형
      options:
        - 용어형 (term)
        - 개념이해형 (concept)
        - 계산형 (calculation)
        - 코드해석형 (code)
        - SQL형 (sql)
        - 서술형 (descriptive)
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: 신뢰도
      options:
        - 복원 (reconstructed)
        - 공식 (official)
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 출처
      description: 출처 이름과 주소(선택). 원문 문장은 붙여 넣지 마세요.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 문항 원문(지문·보기·정답·해설)을 포함하지 않았습니다.
          required: true
        - label: 이 제보 내용을 CC BY 4.0으로 제공하는 데 동의합니다.
          required: true
